<a class="skip-link" href="#main">{{ i18n.t('skipToContent') }}</a>

<header class="app-bar">
  <a class="app-bar__brand" [routerLink]="i18n.homeLink()">ngx-video</a>

  <nav class="app-bar__nav" [attr.aria-label]="i18n.t('mainNav')">
    <a
      class="app-bar__link"
      [routerLink]="i18n.homeLink()"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ i18n.t('navHome') }}
    </a>
    <a
      class="app-bar__link"
      [routerLink]="i18n.docsLink()"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
    >
      {{ i18n.t('navDocs') }}
    </a>
  </nav>

  <label class="app-bar__version">
    <span class="visually-hidden">{{ i18n.t('version') }}</span>
    <select class="app-bar__select" [attr.aria-label]="i18n.t('version')">
      @for (version of versions; track version) {
      <option [value]="version" [selected]="version === currentVersion">
        {{ version }}
      </option>
      }
    </select>
  </label>

  <label class="app-bar__locale">
    <span class="visually-hidden">{{ i18n.t('language') }}</span>
    <select
      class="app-bar__select"
      (change)="changeLocale($event)"
      [attr.aria-label]="i18n.t('language')"
    >
      @for (item of locales; track item.code) {
      <option [value]="item.code" [selected]="item.code === i18n.locale()">
        {{ item.label }}
      </option>
      }
    </select>
  </label>
</header>

<main id="main" class="app-main" tabindex="-1">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <p class="app-footer__text">{{ i18n.t('footerCopyright') }}</p>
</footer>
