<app-docs-layout>
  <app-docs-tabs
    [pkg]="route.pkg"
    [brick]="route.brick"
    [apiPath]="route.apiPath"
    active="example"
  />

  <header class="demo-page__header">
    <div class="demo-page__titles">
      <h1 class="demo-page__title">{{ title() }}</h1>
      <p class="demo-page__pkg">{{ pkg() }}</p>
    </div>

    @if (pro()) {
    <div class="demo-page__badges">
      <span class="chip chip--pro">PRO</span>
    </div>
    }
  </header>

  @if (selector()) {
  <p class="demo-page__selector">
    {{ i18n.t('selector') }}: <code>{{ selector() }}</code>
  </p>
  }

  <p class="demo-page__description">{{ description() }}</p>

  @if (responsibilities().length) {
  <ul class="demo-page__list">
    @for (item of responsibilities(); track item) {
    <li>{{ item }}</li>
    }
  </ul>
  }

  <section class="panel">
    <h2 class="panel__title">{{ i18n.t('liveDemo') }}</h2>
    <div class="panel__body">
      <ng-content />
    </div>
  </section>
</app-docs-layout>
