stages:
  - check

default:
  image: node:22
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .nx/cache/

verify:
  stage: check
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx nx run-many -t lint
    - npx nx run-many -t build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
