stages:
  - check

default:
  image: node:22
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .nx/cache/

verify:
  stage: check
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    # Проверки те же, что в GitHub Actions: скрипты лежат в package.json.
    - npm run ci:audit
    - npm run ci:verify
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
