# Одна джоба — одна команда. Порядок задан стадиями:
#   quick  (параллельно): audit, format — дешёвые, падают первыми
#   verify (параллельно): lint, build  — дорогие, идут после quick
# Команды — npm-скрипты из package.json, те же, что в GitHub Actions.

stages:
  - quick
  - verify

default:
  image: node:22
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .nx/cache/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

audit:
  stage: quick
  script:
    - npm run ci:audit

format:
  stage: quick
  script:
    - npm run ci:format

lint:
  stage: verify
  script:
    - npm run ci:lint

build:
  stage: verify
  script:
    - npm run ci:build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
