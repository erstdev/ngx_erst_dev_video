<button
  type="button"
  class="ngx-fullscreen-button"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="fullscreen()"
  (click)="onClick()"
>
  @if (iconTemplate(); as icon) {
    <ng-container
      [ngTemplateOutlet]="icon"
      [ngTemplateOutletContext]="iconContext()"
    />
  } @else if (fullscreen()) {
    <svg
      class="ngx-fullscreen-button__icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M9 4v4a1 1 0 0 1-1 1H4" />
      <path d="M15 4v4a1 1 0 0 0 1 1h4" />
      <path d="M9 20v-4a1 1 0 0 0-1-1H4" />
      <path d="M15 20v-4a1 1 0 0 1 1-1h4" />
    </svg>
  } @else {
    <svg
      class="ngx-fullscreen-button__icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M4 9V5a1 1 0 0 1 1-1h4" />
      <path d="M20 9V5a1 1 0 0 0-1-1h-4" />
      <path d="M4 15v4a1 1 0 0 0 1 1h4" />
      <path d="M20 15v4a1 1 0 0 1-1 1h-4" />
    </svg>
  }
</button>
