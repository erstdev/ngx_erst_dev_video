<button
  type="button"
  class="ngx-play-button"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="playing()"
  (click)="onClick()"
>
  @if (iconTemplate(); as icon) {
    <ng-container
      [ngTemplateOutlet]="icon"
      [ngTemplateOutletContext]="iconContext()"
    />
  } @else if (playing()) {
    <svg
      class="ngx-play-button__icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <rect x="6" y="4" width="4" height="16" rx="1" />
      <rect x="14" y="4" width="4" height="16" rx="1" />
    </svg>
  } @else {
    <svg
      class="ngx-play-button__icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11-6.86a1 1 0 0 0 0-1.7l-11-6.86A1 1 0 0 0 8 5.14z"
      />
    </svg>
  }
</button>
